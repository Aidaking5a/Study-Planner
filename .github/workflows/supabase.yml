name: Deploy Supabase Backend

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'unvuikzzyfjwhnmjszew' }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required Supabase settings
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF repository variable or workflow fallback" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD secret" && exit 1)

      - name: Link project
        run: npx supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: npx supabase@latest db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Set function configuration
        run: |
          npx supabase@latest secrets set \
            RESULT_UPLOAD_BUCKET=test-result-uploads \
            SCHOOL_INTELLIGENCE_MIN_CONFIDENCE=0.74 \
            SCHOOL_INTELLIGENCE_MIN_EVIDENCE=3 \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy school intelligence function
        run: npx supabase@latest functions deploy school-intelligence --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
